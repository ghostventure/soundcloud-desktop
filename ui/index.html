<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' studio: data: https://*.sndcdn.com; media-src studio:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Soundcloud Desktop</title><link rel="stylesheet" href="style.css"></head><body>
<header class="titlebar"><span class="appmark">▥</span> Soundcloud Desktop <span class="title-caption">Artist workspace</span></header>
<aside><div class="studio-profile"><div class="avatar">S</div><div><strong id="studio-name">Your studio</strong><small>ARTIST WORKSPACE</small></div></div><nav id="nav"></nav><div class="sidebar-bottom"><div class="local-label"><i></i> Saved on this PC</div><button data-page="settings"><span class="icon">⚙</span> Settings</button></div></aside>
<main><div class="topline"><span id="breadcrumb">Workspace / Overview</span><div><span id="today"></span><button class="icon-button" id="tray" title="Minimize to system tray" aria-label="Minimize to system tray">⌄</button></div></div><div id="upload-status" hidden role="status"><div><strong id="upload-title">Uploading</strong><span id="upload-percent"></span></div><progress id="upload-progress" max="100" value="0"></progress><button id="cancel-upload">Cancel upload</button></div><div id="notice" role="status" hidden></div><div id="view"></div></main>
<footer class="player"><div class="now"><div class="mini-cover">♫</div><div><strong id="now-title">Your next great track</strong><small id="now-sub">Choose a track from your library</small></div></div><div class="transport"><div class="transport-buttons"><button id="previous" aria-label="Previous track">⏮</button><button id="play" aria-label="Play or pause" class="play-main">▶</button><button id="next" aria-label="Next track">⏭</button></div><div class="seek-row"><span id="elapsed">0:00</span><input id="seek" aria-label="Playback position" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="volume"><span>♪</span><input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.7"><span class="local-pill">LOCAL AUDIO</span></div><audio id="audio"></audio></footer>
<dialog id="editor"><form id="edit-form"><div id="dialog-content"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save changes</button></div></form></dialog><script src="app.js"></script></body></html>
