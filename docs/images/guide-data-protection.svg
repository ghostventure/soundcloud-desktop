<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SC-DS local data protection map</title>
  <desc id="desc">SC-DS encrypts workspace, recovery, account, sync, and upload receipt data for the current Windows account. Artwork and preferences are not separately encrypted. Audio remains at its original path. Backups are readable JSON.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202329"/><stop offset="1" stop-color="#121418"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#ff6b35"/><stop offset="1" stop-color="#ffad55"/></linearGradient></defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/><text x="48" y="58" fill="#ff9857" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">WHERE YOUR DATA LIVES</text><text x="48" y="96" fill="#f7f7f8" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Your PC keeps the workspace. You choose where backups go.</text>
  <rect x="48" y="127" width="730" height="245" rx="18" fill="#1a1d22" stroke="#41454e"/><rect x="70" y="149" width="686" height="54" rx="10" fill="#292d34"/><path d="M96 169h21l11 10h20v13H96z" fill="none" stroke="#ffad75" stroke-width="2.5"/><text x="165" y="173" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">This Windows account · %APPDATA%\Soundcloud Desktop</text><text x="165" y="191" fill="#a6abb4" font-family="Segoe UI,Arial,sans-serif" font-size="11">Local app data stays on this PC unless you export or upload content</text>
  <g font-family="Segoe UI,Arial,sans-serif"><rect x="70" y="222" width="320" height="63" rx="10" fill="#262a30" stroke="#394a42"/><path d="M90 249v-7a9 9 0 0 1 18 0v7m-21 0h24v20H87z" fill="none" stroke="#91d5ad" stroke-width="2"/><text x="127" y="246" fill="#f3f4f5" font-size="13" font-weight="700">Encrypted with Windows DPAPI</text><text x="127" y="267" fill="#a6abb4" font-size="11">Workspace · recovery · account vault · sync · receipts</text><rect x="405" y="222" width="351" height="63" rx="10" fill="#262a30" stroke="#51453a"/><circle cx="430" cy="253" r="12" fill="none" stroke="#ffb27c" stroke-width="2"/><path d="M430 245v9l6 4" fill="none" stroke="#ffb27c" stroke-width="2"/><text x="454" y="246" fill="#f3f4f5" font-size="13" font-weight="700">Local, not separately encrypted</text><text x="454" y="267" fill="#a6abb4" font-size="11">Some interface history and artwork copies</text><rect x="70" y="300" width="320" height="52" rx="10" fill="#262a30"/><path d="M91 315h24v23H91zM97 309h24v23" fill="none" stroke="#f0c47b" stroke-width="2"/><text x="133" y="322" fill="#f3f4f5" font-size="13" font-weight="700">Backup export is readable JSON</text><text x="133" y="340" fill="#a6abb4" font-size="11">SC-DS warns before you choose a save location</text><rect x="405" y="300" width="351" height="52" rx="10" fill="#262a30"/><path d="M426 313v24m-8-8 8 8 8-8" fill="none" stroke="#94c8ef" stroke-width="2.5"/><text x="454" y="322" fill="#f3f4f5" font-size="13" font-weight="700">Audio stays where you saved it</text><text x="454" y="340" fill="#a6abb4" font-size="11">The workspace refers to your original files</text></g>
  <path d="M778 252h54" stroke="url(#accent)" stroke-width="3" stroke-dasharray="6 7"/><rect x="842" y="127" width="310" height="245" rx="18" fill="#292329" stroke="#77503b"/><circle cx="997" cy="185" r="31" fill="#3b2922" stroke="#ff8b4b" stroke-width="2"/><path d="M986 185h22m-11-11v22" stroke="#ffb27c" stroke-width="3" stroke-linecap="round"/><text x="997" y="241" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Your chosen backup folder</text><text x="997" y="271" text-anchor="middle" fill="#c0c4cb" font-family="Segoe UI,Arial,sans-serif" font-size="12">Copy the JSON backup somewhere</text><text x="997" y="290" text-anchor="middle" fill="#c0c4cb" font-family="Segoe UI,Arial,sans-serif" font-size="12">you control. It excludes credentials</text><text x="997" y="309" text-anchor="middle" fill="#c0c4cb" font-family="Segoe UI,Arial,sans-serif" font-size="12">and audio bytes, but has local paths</text><text x="1152" y="403" text-anchor="end" fill="#858b95" font-family="Segoe UI,Arial,sans-serif" font-size="10">Illustration only · Local account encryption is not protection from malware running as you</text>
</svg>
